name: Build Windows Exe
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4  # Обновили до v4
    - name: Set up Python
      uses: actions/setup-python@v5 # Обновили до v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install pyinstaller
    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --icon=icon.ico main_eng.py
    - name: Upload result
      uses: actions/upload-artifact@v4 # ВОТ ТУТ БЫЛА ОШИБКА, теперь v4
      with:
        name: Quiz-App-Windows
        path: dist/Quiz_eng.exe
